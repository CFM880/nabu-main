# nabu-main repository lock
#
# The kernel and every module are checked out next to this file.  nabu-main
# never embeds module knowledge beyond these paths; the module contract lives
# in each repository's nabu-module.toml.
#
# Only the kernel base is pinned to a commit.  Modules are consumed from their
# working tree as-is (each repository keeps its own branch), so no module
# commit is recorded here.
schema = 1

[kernel]
# Linux base: the upstream b9d5d463 (Linux 6.14.11) tag this port started from.
# The 60 port commits up to 5181e135 (NABU baseline) are now carried as module
# overlays, so `apply` resets here and rebuilds everything from the modules.
path = "linux-6.14"
base = "b9d5d463c216763cec719c04536ea9e14512cad4"

[modules]
nabu-platform      = "nabu-platform"
nabu-display       = "nabu-display"
nabu-touchscreen   = "nabu-touchscreen"
nabu-iris          = "nabu-iris"
nabu-camera        = "nabu-camera"
nabu-audio         = "nabu-audio"
nabu-accelerometer = "nabu-accelerometer"
nabu-power         = "nabu-power"
nabu-serial        = "nabu-serial"
