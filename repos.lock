# nabu-main repository lock
#
# The kernel and every module are checked out next to this file.  nabu-main
# never embeds module knowledge beyond these paths; the module contract lives
# in each repository's nabu-module.toml.
schema = 1

[kernel]
# Linux 7.2.7 port.  Unlike the 6.14 branch the 7.2 port is not (yet) expressed
# as module overlays: it lives directly in the linux-7.2 worktree and is pinned
# here as the base commit.  apply is therefore disabled (it would reset the
# port away and copy the 6.14 overlays over the 7.2 tree); the pipeline stages
# compose/config/build/collect/package/verify run as usual.
path = "linux-7.2"
base = "4d640adb5b58c8d05d484027bb313b53f9cce443"
apply = false

[modules]
nabu-platform      = "nabu-platform"
nabu-display       = "nabu-display"
nabu-touchscreen   = "nabu-touchscreen"
nabu-iris          = "nabu-iris"
nabu-camera        = "nabu-camera"
nabu-audio         = "nabu-audio"
nabu-accelerometer = "nabu-accelerometer"
nabu-power         = "nabu-power"

[commits]
# Module commits as pushed to the `7.2.7` branch of each repository, so the
# pinned trees are reachable on GitHub (not only in this working copy).
nabu-platform      = "888ca5854b2659b5b15894de94b58ce62f37086b"
nabu-display       = "bab7feeaf517acab51ff25321af5b75e24570c8c"
nabu-touchscreen   = "f3f2fc9be9a850f1bd3f5db1c2532a481fa2396b"
nabu-iris          = "b5d839f8dc49bbd43b05db96b58edeae6e996320"
nabu-camera        = "8314e621bd6813920946c0462dada59d6eb67eb3"
nabu-audio         = "8529b208c26a58b716706335d17c585685cd9142"
nabu-accelerometer = "c80da1c7f23f42a44fb8127409ec0a228934807b"
nabu-power         = "3d11930d08d55d2f19e042b2eb87f4f45cd83587"
