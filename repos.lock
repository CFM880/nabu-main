# nabu-main repository lock
#
# The kernel and every module are checked out next to this file.  nabu-main
# never embeds module knowledge beyond these paths; the module contract lives
# in each repository's nabu-module.toml.
schema = 1

[kernel]
# Linux 7.2.7 port, carried as module overlays exactly like the 6.14 branch.
# The base is the clean upstream tag v7.2.7 (f42acb367842): apply resets to it
# and replays every module overlay, and compose regenerates the product DTS.
# The whole port therefore lives in the module repositories; the linux-7.2
# worktree under path is only the build tree.
path = "linux-7.2"
base = "f42acb3678424d1e08f6ed27c0d8ba8a125e14d6"
apply = true

[modules]
nabu-platform      = "nabu-platform"
nabu-display       = "nabu-display"
nabu-touchscreen   = "nabu-touchscreen"
nabu-iris          = "nabu-iris"
nabu-camera        = "nabu-camera"
nabu-audio         = "nabu-audio"
nabu-accelerometer = "nabu-accelerometer"
nabu-power         = "nabu-power"

[commits]
# Module commits as pushed to the `7.2.7` branch of each repository, so the
# pinned trees are reachable on GitHub (not only in this working copy).
nabu-platform      = "f718cfd7b3ad4ef9a211ae4a84e479c628e59a57"
nabu-display       = "8155b0314e851d0b51d1901e7331b60551a14c1d"
nabu-touchscreen   = "662bd34c9a71bf0a21aa8c73a4d3d6f4908a279d"
nabu-iris          = "db2a094f41249028d7c5d17f28caec3b7f86e2b4"
nabu-camera        = "ced3a730b6394ddb61e36d2c111e014681bcfcf3"
nabu-audio         = "b36995b60a7d494d3cd2f5e1033b516647edb637"
nabu-accelerometer = "9b34fbf9c16bfaedf6d69d66b4a208926688112d"
nabu-power         = "d48941b93cdf338a3a70293c08ae4a307c661e5e"
