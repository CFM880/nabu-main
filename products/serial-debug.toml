# Serial-debug product: the production stack plus the USB CDC-ACM console
# (nabu-serial), without the charging stack.
#
# The USB-C port must enumerate as a device for the nabu-serial gadget to
# expose the kernel console, but the charger/Type-C drivers keep it in
# host/charging role and grab the HS PHY's D+/D- for APSD/QC detection.  This
# product therefore drops nabu-power (PM8150B SMB5 + LN8000) instead of only
# blacklisting the modules.
#
# Build it with:
#   make PRODUCT=serial-debug
#   PRODUCT=serial-debug make debian-img
[product]
name    = "serial-debug"
modules = ["nabu-platform", "nabu-display", "nabu-touchscreen", "nabu-iris", "nabu-camera", "nabu-audio", "nabu-accelerometer", "nabu-serial"]
release = "6.14.11-nabu-full"
image   = true
dtb     = "sm8150-xiaomi-nabu-serial-debug.dtb"
cmdline = "config/serial-debug.cmdline"
kernel_config = ["config/sm8150.config", "config/nabu-rtc.config", "config/nabu-debug.config"]
sbat    = "config/uki.sbat"
uki     = "nabu-serial-debug.efi"

[install]
esp        = "/dev/disk/by-partlabel/esp"
esp_mount  = "/boot/efi"
uki_target = "EFI/debian/nabu-debian.efi"
boot_label = "nabu-serial-debug"
