# Production product: every nabu module compiled into one kernel output and
# one unified release, packaged as a single UKI (Image + composed DTB + cmdline).
[product]
name    = "production"
modules = ["nabu-iris", "nabu-camera", "nabu-audio", "nabu-accelerometer", "nabu-power"]
release = "6.14.11-nabu1"
image   = true
dtb     = "sm8150-xiaomi-nabu-production.dtb"
cmdline = "config/production.cmdline"
sbat    = "config/uki.sbat"
uki     = "nabu-production.efi"
