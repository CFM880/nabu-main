# Nabu internal microphone: keep the first capture session alive.
#
# The WCD934x / ADSP capture graph only delivers data on the very first RUN
# after boot.  Every later open (any PCM, any format, any rate) returns a
# constant value instead of audio, until the next reboot -- see the
# "microphone" entry in debian/README.zh.md for the full evidence.
#
# This fragment only stops WirePlumber from sending the "Suspend" command;
# the actual keep-alive is nabu-mic-keepalive.service, which keeps a client
# connected to the source so PipeWire holds the one working capture session.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.platform-sound.HiFi__Mic__source"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
