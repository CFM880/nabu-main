#
# refind.conf - nabu-debian dual-boot menu (Android + Linux)
#
# Loaded by rEFInd (EFI/BOOT/BOOTAA64.EFI on the ESP).  The Android boot
# chain is made to jump here by rodriguezst's DualBootKernelPatcher
# (installer_bootmanager_*.zip, flashed once via TWRP/Magisk); when the
# "Reboot to Android" entry is chosen, Reboot2Android.efi sets the marker
# and warm-reboots into the Android kernel.
#
timeout 5
use_nvram false

hideui singleuser,arrows,hints,editor,badges
banner_scale fillscreen
resolution 1600 2560
showtools reboot, shutdown

scan_all_linux_kernels false
use_graphics_for linux,grub,windows

# The two entries below are explicit, so keep rEFInd from also
# auto-detecting the same files (avoids duplicate menu lines).
dont_scan_dirs EFI/nabu,EFI/Android

# Regular theme shipped in the dual-boot EFI payload
include themes/refind-theme-regular/theme.conf

# Rotate the panel (GopRotate driver): 0/1/2/3 = 0/90/180/270 deg
rotation 3

menuentry "Debian GNU/Linux (nabu)" {
    loader /EFI/nabu/nabu-debian.efi
    icon /EFI/BOOT/themes/refind-theme-regular/icons/256-96/os_debian.png
    graphics on
}

menuentry "Reboot to Android" {
    loader /EFI/Android/Reboot2Android.efi
    icon /EFI/BOOT/themes/refind-theme-regular/icons/256-96/os_android.png
    graphics on
}
